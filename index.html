
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Preparando seu acesso...</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at top, #172554 0%, transparent 55%),
        #0b1020;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      text-align: center;
      background: rgba(21, 29, 48, 0.96);
      border: 1px solid #29364d;
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      animation: aparecer 0.7s ease both;
    }

    .icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      font-size: 34px;
      border-radius: 50%;
      background: #172554;
      border: 1px solid #1e40af;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(25px, 6vw, 30px);
      letter-spacing: -0.8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }

    .timer {
      margin: 30px 0 22px;
      padding: 22px 12px;
      border-radius: 16px;
      background: #101828;
      border: 1px solid #29364d;
    }

    .timer-label {
      color: #cbd5e1;
      font-size: 14px;
    }

    #countdown {
      display: block;
      margin: 12px 0;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #60a5fa;
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 6px;
      overflow: hidden;
      border-radius: 10px;
      background: #29364d;
    }

    #progress {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      transition: width 0.1s linear;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.22);
      transition: transform 0.2s, filter 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .note {
      margin-top: 18px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 28px;
      color: #64748b;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">↗</div>

    <h1>Você está quase lá!</h1>
    <p class="subtitle">
      Estamos preparando seu acesso.<br>
      Você será direcionado em instantes.
    </p>

    <section class="timer" aria-live="polite">
      <p class="timer-label">Redirecionando em</p>
      <span id="countdown">03</span>
      <div
        class="track"
        role="progressbar"
        aria-label="Tempo até o redirecionamento"
        aria-valuemin="0"
        aria-valuemax="3"
        aria-valuenow="0"
      >
        <div id="progress"></div>
      </div>
    </section>

    <a class="button" id="continue" href="https://example.com">
      Acessar agora &nbsp; ↗
    </a>

    <p class="note">
      Se o redirecionamento não acontecer automaticamente,
      utilize o botão acima.
    </p>

    <p class="footer">ACESSO RÁPIDO · SIMPLES · PRÁTICO</p>
  </main>

  <script>
    // ALTERE AQUI PARA O ENDEREÇO DO SEU SITE
    const DESTINO = "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/saiba-como-bets-adoeceram-e-endividaram-os-brasileiros";

    const DURACAO = 3;
    const inicio = Date.now();

    const contador = document.getElementById("countdown");
    const progresso = document.getElementById("progress");
    const barra = document.querySelector('[role="progressbar"]');
    const botao = document.getElementById("continue");

    botao.href = DESTINO;

    function atualizar() {
      const decorrido = (Date.now() - inicio) / 1000;
      const restante = Math.max(0, DURACAO - decorrido);
      const segundos = Math.ceil(restante);
      const percentual = Math.min(100, (decorrido / DURACAO) * 100);

      contador.textContent = String(segundos).padStart(2, "0");
      progresso.style.width = percentual + "%";
      barra.setAttribute("aria-valuenow", String(Math.floor(decorrido)));

      if (restante <= 0) {
        window.location.replace(DESTINO);
        return;
      }

      requestAnimationFrame(atualizar);
    }

    atualizar();
  </script>
</body>
</html>
